# Secret — sensitive configuration (DB password).
# Kubernetes stores Secrets base64-encoded and separately from ConfigMaps.
# The value comes from values.yaml, which CI overrides from GitHub Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.name }}-secret
  labels:
    app: {{ .Values.app.name }}
type: Opaque
stringData:
  DB_PASSWORD: "{{ .Values.postgres.dbPassword }}"