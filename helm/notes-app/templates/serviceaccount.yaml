# ServiceAccount — RBAC identity for the app pods.
# Running under a dedicated ServiceAccount (not 'default') follows
# the principle of least privilege. We don't grant it any extra
# permissions, so it can't touch other cluster resources.
{{- if .Values.security.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.security.serviceAccount.name }}
  labels:
    app: {{ .Values.app.name }}
automountServiceAccountToken: false   # app doesn't need the k8s API token — safer
{{- end }}