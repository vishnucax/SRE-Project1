# Deployment — runs the Notes API (Flask) pods.
# A Deployment manages a set of identical pods, handles rolling updates,
# and restarts pods that die.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  labels:
    app: {{ .Values.app.name }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
      annotations:
        # Tells Prometheus to scrape this pod's /metrics endpoint
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.app.containerPort }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.security.serviceAccount.name }}
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.containerPort }}

          # Inject non-secret config from ConfigMap
          envFrom:
            - configMapRef:
                name: {{ .Values.app.name }}-config
          # Inject the secret password
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-secret
                  key: DB_PASSWORD

          # Resource requests/limits (PDF requirement)
          resources:
            requests:
              cpu: {{ .Values.app.resources.requests.cpu }}
              memory: {{ .Values.app.resources.requests.memory }}
            limits:
              cpu: {{ .Values.app.resources.limits.cpu }}
              memory: {{ .Values.app.resources.limits.memory }}

          # Liveness probe — restart pod if this fails (PDF requirement)
          livenessProbe:
            httpGet:
              path: {{ .Values.app.probes.liveness.path }}
              port: {{ .Values.app.containerPort }}
            initialDelaySeconds: {{ .Values.app.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.liveness.periodSeconds }}

          # Readiness probe — stop sending traffic if this fails (PDF requirement)
          readinessProbe:
            httpGet:
              path: {{ .Values.app.probes.readiness.path }}
              port: {{ .Values.app.containerPort }}
            initialDelaySeconds: {{ .Values.app.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.probes.readiness.periodSeconds }}