# PersistentVolumeClaim — durable disk for Postgres so data survives pod restarts.
# k3s's built-in local-path-provisioner fulfills this automatically.
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.app.name }}-postgres-pvc
  labels:
    app: {{ .Values.app.name }}-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
{{- end }}