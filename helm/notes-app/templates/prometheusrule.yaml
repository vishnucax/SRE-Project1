# PrometheusRule — alerting rules for the Notes API.
# The Prometheus Operator (from kube-prometheus-stack) auto-discovers rules
# labeled with release=monitoring and loads them into Prometheus.
{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.app.name }}-alerts
  labels:
    app: {{ .Values.app.name }}
    release: monitoring        # REQUIRED so kube-prometheus-stack picks it up
spec:
  groups:
    - name: notes-api.rules
      rules:

        # 1. Pod Crash Loop — catches the "Pod Crash Loop" failure scenario
        - alert: NotesApiPodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="default", pod=~"notes-api.*"}[5m]) > 0
          for: 2m
          labels:
            severity: critical
            app: notes-api
          annotations:
            summary: "Notes API pod is crash-looping"
            description: "Pod {{`{{ $labels.pod }}`}} has restarted repeatedly in the last 5 minutes."

        # 2. High CPU — catches the "High CPU" failure scenario
        - alert: NotesApiHighCPU
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="default", pod=~"notes-api.*"}[3m])) by (pod) > 0.4
          for: 2m
          labels:
            severity: warning
            app: notes-api
          annotations:
            summary: "Notes API pod high CPU usage"
            description: "Pod {{`{{ $labels.pod }}`}} CPU usage is above 0.4 cores for 2+ minutes."

        # 3. Pod Not Ready > 5m
        - alert: NotesApiPodNotReady
          expr: sum by (pod) (kube_pod_status_ready{namespace="default", pod=~"notes-api.*", condition="true"}) < 1
          for: 5m
          labels:
            severity: critical
            app: notes-api
          annotations:
            summary: "Notes API pod not ready"
            description: "Pod {{`{{ $labels.pod }}`}} has been not-ready for more than 5 minutes."

        # 4. App Down — Prometheus can't scrape it (catches DB/app-down scenarios)
        - alert: NotesApiDown
          expr: up{job="notes-api"} == 0
          for: 1m
          labels:
            severity: critical
            app: notes-api
          annotations:
            summary: "Notes API target is down"
            description: "Prometheus cannot scrape Notes API instance {{`{{ $labels.instance }}`}}."

        # 5. High Error Rate — many 5xx (catches DB connectivity failures returning 503)
        - alert: NotesApiHighErrorRate
          expr: sum(rate(flask_http_request_total{status=~"5.."}[5m])) > 0.2
          for: 2m
          labels:
            severity: warning
            app: notes-api
          annotations:
            summary: "Notes API high 5xx error rate"
            description: "Notes API is returning 5xx errors above threshold for 2+ minutes."
{{- end }}